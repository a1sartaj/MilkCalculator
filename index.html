<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Milk & Dairy Calculator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calculator-card">
        <!-- Header -->
        <div class="header">
            <div class="header-icon"><i class="fa-solid fa-bottle-droplet"></i></div>
            <div>
                <h2>Dairy Calculator</h2>
                <p>Quick billing & order generation</p>
            </div>
        </div>

        <!-- Dynamic Items Container -->
        <div class="items-list" id="itemsContainer">
            <!-- JavaScript dynamically renders input rows here -->
        </div>

        <!-- Footer / Action Area -->
        <div class="footer">
            <div class="total-display">
                <span class="label">Total Amount</span>
                <span class="amount" id="totalAmount">₹0.00</span>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="calculateBill()">
                    <i class="fa-solid fa-calculator"></i> Calculate
                </button>
                <button class="btn btn-whatsapp" onclick="sendWhatsApp()" title="Send on WhatsApp">
                    <i class="fa-brands fa-whatsapp"></i>
                </button>
            </div>
        </div>

        <!-- Bill Summary Modal -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h3><i class="fa-solid fa-receipt"></i> Order Summary</h3>
                    <button type="button" class="icon-btn" onclick="closeModal()" aria-label="Close order summary" title="Close order summary"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="modal-body">
                    <textarea id="summaryText" readonly></textarea>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" onclick="copySummaryText()">
                        <i class="fa-regular fa-copy"></i> Copy Text
                    </button>
                    <button class="btn btn-whatsapp flex-1" onclick="sendWhatsApp()">
                        <i class="fa-brands fa-whatsapp"></i> WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
